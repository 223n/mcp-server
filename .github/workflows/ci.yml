name: CI

# 5つの検査をする。
#   lint-ja         文書の書式（markdownlint）と日本語の書き方（textlint）。
#                   規則は公開されている共有設定 @223n/lint-config-ja にあり、ここには「何を検査するか」だけを書く
#   lint-workflows  ワークフローの構文と型（actionlint）
#   zizmor          ワークフローの安全性（zizmor）。アクションの SHA 固定、権限、危険な書き方を見る
#   test            サーバーの試験（npm test）。Node 22 と 26 で動かす
#   docker          Docker イメージを作り、起動して HTTP と stdio の応答を確かめる。
#                   あわせて Trivy でイメージの脆弱性を見る（apk のパッケージは Dependabot が追わないため）
#
# プロジェクト固有のビルドやテストは、これらと並ぶジョブとして足す。
on:
  push:
    branches: [main, develop]
  pull_request:
  # 手で動かすため。
  # GITHUB_TOKEN が開いた PR（リリースの PR など）では、pull_request の実行は「承認待ち」で作られ、
  # 書き込み権限のある人が「Approve workflows to run」を押すまで動かない
  workflow_dispatch:

# 同じブランチに続けて push したとき、古い実行を止める
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-ja:
    name: 日本語Lint
    # セルフホストのランナーがあれば、リポジトリの変数 RUNS_ON にそのラベル（例: self-hosted）を設定する。
    # 無ければ GitHub がホストする ubuntu-latest で動く
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    # 固まったまま枠を占め続けないようにする
    timeout-minutes: 10
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 検査だけなので、認証情報は残さない
          persist-credentials: false

      - name: Nodeを用意
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # markdownlint-cli2 0.23 が Node 22 以上を求める
          node-version: '22'
          cache: npm

      - name: 依存を入れる
        run: npm ci

      - name: Markdownの書式を検査する
        run: npm run lint:md

      - name: 日本語の書き方を検査する
        run: npm run lint:ja

  lint-workflows:
    name: ワークフローの構文検査
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlintを入れる
        id: actionlint
        # 公式の導入スクリプトを使う。スクリプトはタグ v1.7.12 のコミットで固定し、版も渡す。
        # shellcheck が入っていればシェルの検査も行い、無ければその規則だけ飛ばす
        run: |
          bash <(curl -sSfL 'https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash') 1.7.12

      - name: ワークフローを検査する
        env:
          ACTIONLINT: ${{ steps.actionlint.outputs.executable }}
        run: |
          "${ACTIONLINT}" -color

  zizmor:
    name: ワークフローの安全性検査
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: zizmorで検査する
        # zizmor-action はコンテナで動くため、セルフホストのランナーには Docker が要る。
        # advanced-security を切ると Code scanning へは送らず、指摘があればこのジョブが失敗する。
        # zizmor の版は固定する。版が上がると監査が増えて、変更していないのに落ちることがあるため
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: v1.30.0
          advanced-security: false

  test:
    name: サーバーの試験
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 10
    strategy:
      # 片方の版で落ちても、もう片方の結果を見られるようにする
      fail-fast: false
      matrix:
        # 22 は package.json の engines の下限、26 は Dockerfile の版
        node-version: ['22', '26']
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Nodeを用意
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: 依存を入れる
        run: npm ci

      - name: 試験する
        # Ollama の代わりに試験用のサーバー（test/helpers/mock-ollama.js）を使うため、GPU は要らない
        run: npm test

  docker:
    name: Dockerイメージの確認
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 15
    env:
      # セルフホストのランナーで他の実行とぶつからないよう、名前は実行ごとに変える。
      # ホストのポートは使わず、確かめるのもコンテナーの中から行う
      CONTAINER: mcp-server-ci-${{ github.run_id }}-${{ github.run_attempt }}
      IMAGE: mcp-server:ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: イメージを作る
        run: docker build --tag "${IMAGE}" .

      # apk で入れたパッケージ（git など）の版は Dependabot が追わない。
      # CVE はベースイメージのダイジェストが動いたときにしか拾えないため、ここで見る。
      # 直せるもの（ignore-unfixed）だけで落とす。上流に修正が無いものは出すだけにする
      - name: イメージの脆弱性を検査する
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

      # 直せないものも記録に残す。こちらは落とさない
      - name: 直せない脆弱性を一覧する
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '0'
          format: table
          skip-setup-trivy: true

      - name: 起動して応答を確かめる
        run: |
          docker run --detach --name "${CONTAINER}" "${IMAGE}"

          for _ in $(seq 1 30); do
            if docker exec "${CONTAINER}" wget -qO- http://127.0.0.1:3000/healthz; then
              break
            fi
            sleep 1
          done
          docker exec "${CONTAINER}" wget -qO- http://127.0.0.1:3000/healthz

          initialize='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}'

          # 応答はいったん変数に受ける。grep を直につなぐと、先に終わった grep で書き手が SIGPIPE になり、
          # pipefail でジョブが落ちることがあるため
          http_response=$(docker exec "${CONTAINER}" wget -qO- \
            --header 'Content-Type: application/json' \
            --header 'Accept: application/json, text/event-stream' \
            --post-data "${initialize}" \
            http://127.0.0.1:3000/mcp)
          echo "HTTP: ${http_response}"
          grep --quiet '"serverInfo"' <<< "${http_response}"

          # stdio は stdin を閉じると終わるため、応答を待つ間は開いておく
          stdio_response=$({ echo "${initialize}"; sleep 3; } | docker exec -i "${CONTAINER}" node stdio.js)
          echo "stdio: ${stdio_response}"
          grep --quiet '"serverInfo"' <<< "${stdio_response}"

      - name: ログを出して片付ける
        if: always()
        run: |
          docker logs "${CONTAINER}" || true
          docker rm --force "${CONTAINER}" || true
          docker image rm "${IMAGE}" || true
